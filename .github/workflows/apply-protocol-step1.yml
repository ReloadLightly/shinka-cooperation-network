name: Verify bounded protocol repair
on:
  push:
    branches: ['repairs/step1-explicit-protocol-20260921']
    paths: ['.maintenance/protocol-step1.patch.gz.*', '.github/workflows/apply-protocol-step1.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/repairs/step1-explicit-protocol-20260921'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply checksum-bound source patch and run offline tests
        shell: bash
        run: |
          set -euo pipefail
          cat .maintenance/protocol-step1.patch.gz.0* > /tmp/step1.patch.gz
          echo 'ff74f325a1271c06595b3e2306332e6efe44ca1e7d2f0bd325b25184b6591631  /tmp/step1.patch.gz' | sha256sum --check
          gzip -dc /tmp/step1.patch.gz > /tmp/step1.patch
          echo 'da89d878328ff5c6976d8528cc175be97190bfc0dd6ace0e1b6b822d0d5f8372  /tmp/step1.patch' | sha256sum --check
          git apply --check /tmp/step1.patch
          git apply /tmp/step1.patch
          python -m compileall -q evaluate.py scripts shinka tests
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/step1-tests.log
          python scripts/update_readme_status.py --check
          git add README.md docs/REPAIR_STEPS.md docs/RUNBOOK.md docs/SELECTION.md docs/SHINKA_CONTRACT.md evaluate.py scripts/conventional_search.py scripts/run_shinka.py shinka/check_native_evaluator.py shinka/native_config.json tests/test_protocol_routing.py
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              'README.md': 'db5438662e7843cf358185a106444cf6c683ba9a',
              'docs/REPAIR_STEPS.md': 'bceeeb7ca57af13f1489c07943cef5f37a947c0a',
              'docs/RUNBOOK.md': '3f246cce1f5dca74382a453bb4d0cd37c225a7c9',
              'docs/SELECTION.md': '052864168692be2fa6e45b50b8dec0b86e549cf9',
              'docs/SHINKA_CONTRACT.md': '73377d8d8db26c514de571e549d523cd1c116ab2',
              'evaluate.py': 'f7b963068de63ad88281c0bcc0d7156107b2a189',
              'scripts/conventional_search.py': 'd7c597a23dfe63a1179c609d7f93962565f3be50',
              'scripts/run_shinka.py': 'bdca746e64f1596ad4e712ca5bb8de308f1994bc',
              'shinka/check_native_evaluator.py': '84ba6a5f8c15aa087d0f27d6109310b9b36d2efd',
              'shinka/native_config.json': 'fb429b0da9c3717c9b457c738ac86990796172cf',
              'tests/test_protocol_routing.py': '22943c2134bde4869e0fa566e3e012bba56c3e55',
          }
          names = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert names == set(expected), names.symmetric_difference(expected)
          for name, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',name], text=True).strip() == sha, name
          print('Exact locally tested 11-file repair verified; original R/settings/results untouched.')
          PY
      - name: Commit tested sources only on this repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply tested bounded repair: explicit protocol selection'
          git push origin HEAD:repairs/step1-explicit-protocol-20260921
          git log -1 --format='TESTED_COMMIT=%H%nTESTED_TREE=%T'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-step1-tests
          path: /tmp/step1-tests.log
          retention-days: 7
