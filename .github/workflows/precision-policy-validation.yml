name: Precision policy - saved evidence and stopped initialization
on:
  push:
    branches: [repairs/precision-policy-v1-20260921]
    paths: [.github/workflows/precision-policy-validation.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      R_GC_MEM_GROW: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Publish reviewed no-overwrite receipt checks before validation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('R/precision_convergence.R');s=p.read_text()
          old='  meta<-readRDS(done)\n  for(n'
          new='''  meta<-readRDS(done)
            required<-if(!is.null(meta$vector_key))c("started.rds","result.rds","diagnostics.json")else c("started.rds","fit.rds")
            assert(all(required%in%names(meta$files)),"Incomplete operation artifact list")
            assert(all(basename(names(meta$files))==names(meta$files)),"Unsafe operation artifact path")
            for(n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='      if(!file.exists(file.path(outdir,"accepted_fit.rds")))precision_save(ans,file.path(outdir,"accepted_fit.rds"))'
          new='''      receipt<-file.path(outdir,"accepted_fit.rds")
                if(file.exists(receipt)){
                  old<-readRDS(receipt)
                  assert(identical(old$convergence_policy,ans$convergence_policy)&&
                    identical(old$accepted_attempt,ans$accepted_attempt)&&identical(old$authoritative_n3,ans$authoritative_n3)&&
                    identical(old$authoritative_diagnostics,ans$authoritative_diagnostics)&&
                    identical(as.numeric(old$fit$theta),as.numeric(ans$fit$theta))&&
                    identical(parameter_keys(old$fit$requestedEffects),parameter_keys(ans$fit$requestedEffects)),
                    "Uncommitted accepted receipt differs from replayed checkpoint decisions")
                }else precision_save(ans,receipt)'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R/precision_convergence.R
          git diff --cached --check
          git commit -m 'Bind partial acceptance receipts and require complete operation evidence before reuse'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            environment/runtime
            environment/R-library
            environment/bin
            environment/downloads
            vendor/RSiena
          key: step3b-native-r421-rsiena1310-${{ hashFiles('environment/conda-linux-64.explicit.txt') }}
      - name: Install pinned runtime only on cache miss
        run: |
          set -euo pipefail
          mkdir -p environment/{bin,downloads,R-library,conda-pkgs} vendor
          export MAMBA_ROOT_PREFIX="$PWD/environment/conda-pkgs"
          if [ ! -x environment/bin/micromamba ]; then
            curl --fail --location --retry 2 https://micro.mamba.pm/api/micromamba/linux-64/2.9.0 -o environment/downloads/micromamba.tar.bz2
            echo '8761c382127e6363bd9e0a2451aa3ef90d071a79133f736e2f759a3bf13040dd  environment/downloads/micromamba.tar.bz2' | sha256sum -c -
            tar -xjf environment/downloads/micromamba.tar.bz2 -C environment bin/micromamba
          fi
          if [ ! -x environment/runtime/bin/Rscript ]; then
            environment/bin/micromamba create --yes --prefix "$PWD/environment/runtime" --file environment/conda-linux-64.explicit.txt
          fi
          if [ ! -d vendor/RSiena ]; then
            curl --fail --location --retry 2 https://github.com/stocnet/rsiena/archive/refs/tags/v1.3.10.tar.gz -o environment/downloads/RSiena-v1.3.10.tar.gz
            echo 'c7e0fc358f064e6b5d753ceb675a2eb00ea08cd6d58934ebabef31055302a1d5  environment/downloads/RSiena-v1.3.10.tar.gz' | sha256sum -c -
            tar -xzf environment/downloads/RSiena-v1.3.10.tar.gz -C vendor
            mv vendor/rsiena-1.3.10 vendor/RSiena
          fi
          if [ ! -f environment/R-library/RSiena/DESCRIPTION ]; then
            environment/bin/micromamba run --prefix "$PWD/environment/runtime" R CMD INSTALL --library="$PWD/environment/R-library" vendor/RSiena
          fi
      - name: Python contracts and training-only input verification
        run: |
          set -euo pipefail
          OUT=results/diagnostics/precision-policy-v1
          mkdir -p "$OUT"
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v > "$OUT/python-tests.log" 2>&1
          cat "$OUT/python-tests.log"
          python scripts/update_readme_status.py --check
          python scripts/convergence_preflight.py check
          python - <<'PY'
          from pathlib import Path
          from scripts.precision_fit import packet_bytes
          Path('/tmp/precision-policy-past.rds').write_bytes(packet_bytes(Path.cwd(),2009))
          PY
      - name: Native fixture replay and two stopped initializations; no simulation
        env:
          PRECISION_TEST_PAST: /tmp/precision-policy-past.rds
          PRECISION_TEST_REPORT: results/diagnostics/precision-policy-v1/native-tests.json
        run: |
          set -euo pipefail
          OUT=results/diagnostics/precision-policy-v1
          /usr/bin/time -v -o "$OUT/resources.txt" environment/run-r R/test_precision_policy.R > "$OUT/native-tests.log" 2>&1
          cat "$OUT/native-tests.log"
          rm /tmp/precision-policy-past.rds
          git diff --exit-code
          python - <<'PY'
          import json,pathlib,os,subprocess,re,hashlib
          out=pathlib.Path('results/diagnostics/precision-policy-v1')
          r=json.loads((out/'native-tests.json').read_text())
          assert r['status']=='passed' and all(r[k]==0 for k in ['new_simulations','new_refits','new_forecasts','target_packets_read'])
          tests=(out/'python-tests.log').read_text()
          assert re.search(r'^OK$',tests,re.M)
          n=int(re.search(r'Ran (\d+) tests',tests).group(1))
          record={'status':'verified','policy':'precision-before-continuation-v1',
            'workflow_run':os.environ['GITHUB_RUN_ID'],'workflow_commit':os.environ['GITHUB_SHA'],
            'tested_source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'python_tests':n,'native_checks':r['checks'],'new_simulations':0,'new_refits':0,
            'new_forecasts':0,'target_packets_read':0,'step4_started':False,
            'saved_fixture_replay_only':True,'real_native_initializations_stopped_before_phase3':2,
            'live_production_assessment_not_executed':True}
          (out/'execution.json').write_text(json.dumps(record,indent=2)+'\n')
          evidence={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}
          (out/'commitment.json').write_text(json.dumps({'files':evidence},indent=2)+'\n')
          print(json.dumps(record,indent=2))
          PY
      - name: Preserve completed validation evidence on the repair branch
        run: |
          set -euo pipefail
          git add results/diagnostics/precision-policy-v1
          git diff --cached --check -- '*.json'
          git commit -m 'Verify prospective precision policy with saved native fixtures and zero new simulations'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: precision-policy-validation
          path: results/diagnostics/precision-policy-v1
          if-no-files-found: ignore
          retention-days: 1
