name: Step 3A verify without simulation
on:
  push:
    branches: [repairs/step3a-diagnostic-preflight-20260921]
    paths: [.github/workflows/step3a-verify.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: step3a-verification-evidence
          run-id: 35594291946
          github-token: ${{ github.token }}
          path: /tmp/step3a-completed
      - name: Restore and validate completed evidence, with no native execution
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,os,shutil,re
          from scripts.convergence_preflight import inspect,verify_artifacts,sha
          staging=Path('/tmp/step3a-completed')
          sources=list(staging.glob('**/convergence-preflight-v1/commitment.json'))
          assert len(sources)==1
          out=Path('results/diagnostics/convergence-preflight-v1')
          assert not out.exists()
          shutil.copytree(sources[0].parent,out)
          verify_artifacts(out)
          current=inspect(); original=json.loads((out/'inputs.json').read_text())
          assert current['policy_sha256']==original['policy_sha256']
          assert current['implementation']==original['implementation']
          for name,digest in current['files'].items():
              assert original['files'][name]==digest
          tests=(staging/'tmp/step3a-tests.log').read_text()
          assert re.search(r'^OK\s*$',tests,re.MULTILINE)
          n=int(re.search(r'Ran (\d+) tests',tests).group(1))
          assert n==117
          shutil.copy2(staging/'tmp/step3a-tests.log',out/'python-tests.log')
          shutil.copy2(staging/'tmp/step3a-resources.txt',out/'resources.txt')
          assert 'Exit status: 0' in (out/'resources.txt').read_text()
          execution={'stage':'3A','status':'verified_no_simulation',
            'native_workflow_run':35594291946,'native_source_commit':'f6dce99f6f562ba391511d7d8087ca74b0b5795b',
            'publication_workflow_run':os.environ['GITHUB_RUN_ID'],'publication_source_commit':os.environ['GITHUB_SHA'],
            'python_tests':n,'real_saved_fit_loaded':True,'only_training_packet_decompressed':True,
            'native_initialization_stopped_before_phase3_body':True,'original_tracked_files_unchanged':True,
            'new_simulations':0,'new_refits':0,'new_forecasts':0,'target_packets_read':0,'raw_archives_read':0,
            'native_execution_repeated_for_publication':False,'step3b_started':False,
            'publication_repair':'The native verification and all 117 tests passed. A helper incorrectly required OK at the end of the merged test log; buffered fixture output followed OK. Match the standalone status line instead, preserve original evidence and do not rerun native initialization.'}
          (out/'execution.json').write_text(json.dumps(execution,indent=2)+'\n')
          (out/'publication-commitment.json').write_text(json.dumps({'artifacts':{
            p.name:sha(p) for p in sorted(out.iterdir()) if p.is_file()}},indent=2)+'\n')
          print(json.dumps(execution,indent=2))
          PY
          python -m unittest discover -s tests -v
          python scripts/update_readme_status.py --check
          python scripts/convergence_preflight.py verify-artifacts
          git diff --exit-code
          test ! -e data/targets/2009.rds
          test ! -e data/targets/2010.rds
      - name: Preserve evidence on this branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/diagnostics/convergence-preflight-v1
          git diff --cached --check -- '*.json' '*.csv'
          git commit -m 'Record completed Step 3A verification: identical native initialization and old diagnostics, zero simulations'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step3a-published-evidence
          path: results/diagnostics/convergence-preflight-v1
          if-no-files-found: ignore
          retention-days: 14
