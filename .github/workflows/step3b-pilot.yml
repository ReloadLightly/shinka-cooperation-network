name: Step 3B single fixed-theta diagnostic
on:
  push:
    branches: [repairs/step3b-fixed-theta-pilot-20260921]
    paths: [.github/workflows/step3b-pilot.yml]
permissions:
  contents: write
concurrency:
  group: step3b-fixed-theta-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      R_GC_MEM_GROW: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse automatic workflow retries
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/cache@v4
        with:
          path: |
            environment/runtime
            environment/R-library
            environment/bin
            environment/downloads
            vendor/RSiena
          key: step3a-native-r421-rsiena1310-${{ hashFiles('environment/conda-linux-64.explicit.txt') }}
      - name: Install pinned runtime without raw-data preparation
        run: |
          set -euo pipefail
          mkdir -p environment/{bin,downloads,R-library,conda-pkgs} vendor
          export MAMBA_ROOT_PREFIX="$PWD/environment/conda-pkgs"
          if [ ! -x environment/bin/micromamba ]; then
            curl --fail --location --retry 2 https://micro.mamba.pm/api/micromamba/linux-64/2.9.0 -o environment/downloads/micromamba.tar.bz2
            echo '8761c382127e6363bd9e0a2451aa3ef90d071a79133f736e2f759a3bf13040dd  environment/downloads/micromamba.tar.bz2' | sha256sum -c -
            tar -xjf environment/downloads/micromamba.tar.bz2 -C environment bin/micromamba
          fi
          if [ ! -x environment/runtime/bin/Rscript ]; then
            environment/bin/micromamba create --yes --prefix "$PWD/environment/runtime" --file environment/conda-linux-64.explicit.txt
          fi
          if [ ! -d vendor/RSiena ]; then
            curl --fail --location --retry 2 https://github.com/stocnet/rsiena/archive/refs/tags/v1.3.10.tar.gz -o environment/downloads/RSiena-v1.3.10.tar.gz
            echo 'c7e0fc358f064e6b5d753ceb675a2eb00ea08cd6d58934ebabef31055302a1d5  environment/downloads/RSiena-v1.3.10.tar.gz' | sha256sum -c -
            tar -xzf environment/downloads/RSiena-v1.3.10.tar.gz -C vendor
            mv vendor/rsiena-1.3.10 vendor/RSiena
          fi
          if [ ! -f environment/R-library/RSiena/DESCRIPTION ]; then
            environment/bin/micromamba run --prefix "$PWD/environment/runtime" R CMD INSTALL --library="$PWD/environment/R-library" vendor/RSiena
          fi
      - name: Python contracts and deterministic native guard tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/step3b-tests.log
          python scripts/update_readme_status.py --check
          python scripts/convergence_pilot.py check > /tmp/step3b-input-check.json
          python scripts/convergence_pilot.py self-test 2>&1 | tee /tmp/step3b-guards.log
      - name: One 3000-draw phase-3 pilot; no optimization or scoring
        id: measurement
        run: |
          set -euo pipefail
          python scripts/convergence_pilot.py run --execute 2>&1 | tee /tmp/step3b-driver.log
          python scripts/convergence_pilot.py verify-artifacts > /tmp/step3b-verified-result.json
          test ! -e data/targets/2009.rds
          test ! -e data/targets/2010.rds
          test ! -e data/past/2010.rds
          git diff --exit-code
      - name: Preserve completed or failed evidence without repeating native work
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
        run: |
          set -euo pipefail
          OUT=results/diagnostics/convergence-pilot-v1
          if [ -d "$OUT" ]; then
            python - <<'PY'
          import json,os,pathlib,re,shutil
          out=pathlib.Path('results/diagnostics/convergence-pilot-v1')
          for stem in ('tests','guards','input-check','driver'):
              for p in pathlib.Path('/tmp').glob('step3b-'+stem+'.*'):
                  shutil.copy2(p,out/('workflow-'+p.name))
          result=json.loads((out/'result.json').read_text()) if (out/'result.json').exists() else {}
          tests=pathlib.Path('/tmp/step3b-tests.log').read_text()
          match=re.search(r'Ran (\d+) tests',tests)
          execution={'stage':'3B','workflow_run':os.environ['GITHUB_RUN_ID'],
            'source_commit':os.environ['GITHUB_SHA'],'measurement_outcome':os.environ['MEASUREMENT_OUTCOME'],
            'result_status':result.get('status','failed_or_incomplete'),
            'python_tests':int(match.group(1)) if match else None,
            'source_tests_passed':bool(re.search(r'^OK\s*$',tests,re.M)),
            'new_refits':0,'new_forecasts':0,'raw_archives_read':0,'outcome_packets_read':0,
            'additional_repetitions_started':False}
          (out/'execution.json').write_text(json.dumps(execution,indent=2)+'\n')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "$OUT"
            git diff --cached --check -- '*.json' '*.csv'
            if ! git diff --cached --quiet; then
              git commit -m 'Preserve single Step 3B diagnostic evidence without altering original fits or acceptance'
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step3b-native-evidence
          path: results/diagnostics/convergence-pilot-v1
          if-no-files-found: ignore
          retention-days: 30
