# Prepared handoff; no native pilot has been run by the authoring session.
name: Step 3B - single fixed-coefficient pilot
'on':
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: step3b-pilot-2009301
  cancel-in-progress: false
jobs:
  pilot:
    if: ${{ github.repository == 'ReloadLightly/shinka-cooperation-network' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      SCIENTIFIC_BASE: 0ea19d8ac6cf4092c51372d66c8c09a9e68485b0
      RESULT_BRANCH: repairs/step3b-pilot-2009301
      R_GC_MEM_GROW: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MAKEFLAGS: -j2
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 0ea19d8ac6cf4092c51372d66c8c09a9e68485b0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Materialize the single-pilot implementation
      run: |
        set -euo pipefail
        cat > R/convergence_pilot.R <<'STEP3B_FILE_0_END'
        # Step 3B: ONE phase-3-only assessment of the saved 2009 attempt-3 vector.
        # This file loads the hash-bound 3A function definitions, never its CLI.
        expressions <- parse("R/convergence_preflight.R")
        cli_start <- which(vapply(as.list(expressions), function(e)
          is.call(e) && identical(e[[1]], as.name("<-")) &&
          identical(e[[2]], as.name("args")), logical(1)))
        stopifnot(length(cli_start) == 1L, cli_start == length(expressions) - 1L)
        for (e in as.list(expressions)[seq_len(cli_start - 1L)]) eval(e, .GlobalEnv)

        check_simulation_state <- function(z, theta, fromFiniteDiff=FALSE) {
          assert(identical(as.numeric(z$theta), as.numeric(theta)), "Simulator coefficient vector changed")
          assert(z$Phase == 3L && z$pp == 58L, "Unexpected simulation phase or parameter count")
          assert(identical(fromFiniteDiff,FALSE) && identical(z$FinDiff.method,FALSE),
            "Finite differences would perturb the coefficient vector")
          assert(!isTRUE(z$maxlike) && !isTRUE(z$gmm) && !isTRUE(z$cconditional), "Different native method")
          assert(is.null(z$cl) && isTRUE(z$Deriv), "Expected serial score-based phase 3")
        }

        check_phase3_state <- function(z,x,fit) {
          assert(x$nsub == 0L && x$n3 == 3000L && x$randomSeed == 2009301L &&
            identical(x$simOnly,FALSE), "Unapproved pilot settings")
          assert(z$n == 0L && !isTRUE(z$cconditional), "Optimization or conditioning detected")
          assert(identical(as.numeric(z$theta),as.numeric(fit$theta)), "Initialization changed theta")
          assert(identical(parameter_keys(z$requestedEffects),parameter_keys(fit$requestedEffects)), "Effect ordering changed")
          assert(identical(as.logical(z$fixed),as.logical(fit$fixed)) && !any(z$fixed), "Fixed flags changed")
          assert(same_numbers(z$targets,fit$targets,0) && same_numbers(z$targets2,fit$targets2,0), "Training targets changed")
          assert(z$observations == 19L && z$pp == 58L, "Training scope changed")
        }

        pilot_self_tests <- function() {
          n <- 0L
          bad <- function(expr) {assert(inherits(try(force(expr),silent=TRUE),"try-error"),"Expected refusal");n<<-n+1L}
          theta <- seq_len(58L)/100
          z <- list(theta=theta,Phase=3L,pp=58L,FinDiff.method=FALSE,maxlike=FALSE,
            gmm=FALSE,cconditional=FALSE,cl=NULL,Deriv=TRUE)
          check_simulation_state(z,theta);n<-n+1L
          moved <- z;moved$theta[2]<-moved$theta[2]+1e-10;bad(check_simulation_state(moved,theta))
          wrong <- z;wrong$Phase<-2L;bad(check_simulation_state(wrong,theta))
          wrong <- z;wrong$FinDiff.method<-TRUE;bad(check_simulation_state(wrong,theta))
          bad(check_simulation_state(z,theta,TRUE))
          wrong <- z;wrong$cconditional<-TRUE;bad(check_simulation_state(wrong,theta))
          wrong <- z;wrong$cl<-list("worker");bad(check_simulation_state(wrong,theta))
          wrong <- z;wrong$Deriv<-FALSE;bad(check_simulation_state(wrong,theta))
          list(status="passed",checks=n,new_simulations=0L)
        }

        run_pilot <- function(root,output) {
          assert(as.character(getRversion())=="4.2.1" && as.character(packageVersion("RSiena"))=="1.3.10", "Wrong native runtime")
          source_audit <- native_source_check(file.path(root,"vendor/RSiena"))
          tests <- pilot_self_tests()
          policy <- read_json("configs/convergence-preflight-v1.json",simplifyVector=TRUE)
          fit <- readRDS(file.path(root,policy$fit_path))
          packet <- readRDS(file.path(output,"training-packet.rds"))
          assert(identical(as.integer(packet$years),1990:2008) && length(packet$nms)==161L, "Wrong training packet")
          assert(length(fit$theta)==58L && nrow(fit$sf)==1000L && fit$Phase3nits==1000L, "Wrong saved fit")
          old <- fit_diagnostics(fit,1000L)
          assert(identical(old$valid,FALSE) && isTRUE(old$finite_identified), "Historical status changed")
          netdata <- make_training_data(packet)
          bound <- bind_saved_theta(model_effects(netdata),fit)
          x <- prepare_algorithm(fit,file.path(output,"native-pilot"))
          original_theta <- fit$theta
          st <- new.env(parent=emptyenv())
          st$phase3_entries<-0L;st$sim_entries<-0L;st$sim_exits<-0L;st$forbidden<-0L
          st$nr_entries<-0L;st$postprocess_entries<-0L;st$warnings<-character()
          st$started <- proc.time()[[3]]
          audit <- function(status) list(status=status,phase3_entries=st$phase3_entries,
            simulator_entries=st$sim_entries,simulator_exits=st$sim_exits,
            forbidden_entries=st$forbidden,potential_nr_calls=st$nr_entries,
            postprocessing_entries=st$postprocess_entries,
            checked_every_simulator_call=TRUE,seed=2009301L,nsub=0L,n3=3000L,simOnly=FALSE,
            warnings=st$warnings,elapsed_seconds=unname(proc.time()[[3]]-st$started))
          flush_audit <- function(status) write_json(audit(status),file.path(output,"guard-audit.json"),
            auto_unbox=TRUE,pretty=TRUE,digits=17,na="null")
          block <- function() {st$forbidden<-st$forbidden+1L;stop("Optimization/alternative simulator forbidden",call.=FALSE)}
          enter_phase <- function(z,x) {
            st$phase3_entries<-st$phase3_entries+1L
            assert(st$phase3_entries==1L,"Second phase-3 entry forbidden")
            check_phase3_state(z,x,fit);flush_audit("phase3_entered")
          }
          enter_sim <- function(z,fromFiniteDiff) {
            check_simulation_state(z,original_theta,fromFiniteDiff)
            assert(st$phase3_entries==1L && st$sim_entries==st$sim_exits,"Unexpected simulator call sequence")
            st$sim_entries<-st$sim_entries+1L
            assert(st$sim_entries<=3000L,"Pilot simulation budget exceeded")
          }
          exit_sim <- function(z) {
            check_simulation_state(z,original_theta,FALSE)
            st$sim_exits<-st$sim_exits+1L
            if(st$sim_exits %% 250L==0L) {
              flush_audit("running")
              cat(sprintf("STEP3B: %d/3000 draws; theta unchanged; elapsed %.1f s\n",st$sim_exits,proc.time()[[3]]-st$started))
              flush.console()
            }
          }
          before_postprocess <- function(z,x) {
            st$postprocess_entries<-st$postprocess_entries+1L
            assert(st$postprocess_entries==1L && st$sim_exits==3000L,"Incomplete phase-3 draws")
            assert(identical(as.numeric(z$theta),as.numeric(original_theta)),"Theta moved before diagnostics")
            assert(identical(dim(z$sf),c(3000L,58L)) && all(is.finite(z$sf)),"Malformed phase-3 matrix")
            # Preserve the samples before derivative/covariance postprocessing can fail.
            saveRDS(list(sf=z$sf,ssc=z$ssc,sf2=z$sf2,theta=z$theta,targets=z$targets,
              targets2=z$targets2,fixed=z$fixed,requestedEffects=z$requestedEffects),
              file.path(output,"raw-phase3.rds"))
          }
          before_nr <- function(z,x,MakeStep) {
            st$nr_entries<-st$nr_entries+1L
            assert(identical(MakeStep,FALSE),"Newton coefficient adjustment forbidden")
            assert(identical(as.numeric(z$theta),as.numeric(original_theta)),"Theta changed before Newton diagnostic")
          }
          ns<-asNamespace("RSiena");traced<-character()
          on.exit({for(n in rev(traced))untrace(n,where=ns)},add=TRUE)
          add_trace<-function(name,expr,exit=NULL) {
            trace(name,tracer=expr,exit=exit,where=ns,print=FALSE);traced<<-c(traced,name)
          }
          for(n in c("phase1.1","phase1.2","phase2.1","proc2subphase","maxlikec")) add_trace(n,block)
          add_trace("phase3",substitute(F(z,x),list(F=enter_phase)))
          add_trace("simstats0c",substitute(F(z,fromFiniteDiff),list(F=enter_sim)),
            substitute(F(z),list(F=exit_sim)))
          add_trace("phase3.2",substitute(F(z,x),list(F=before_postprocess)))
          add_trace("PotentialNR",substitute(F(z,x,MakeStep),list(F=before_nr)))
          flush_audit("prepared")
          result <- tryCatch(withCallingHandlers(
            siena07(x,data=netdata,effects=bound$effects,prevAns=NULL,batch=TRUE,
              silent=TRUE,useCluster=FALSE,returnDeps=FALSE),
            warning=function(w) {st$warnings<-c(st$warnings,conditionMessage(w))}),
            error=function(e) {flush_audit("failed");stop(e)})
          # Save even a numerically unsuccessful result. Never rerun a seed to get a pass.
          saveRDS(result,file.path(output,"diagnostic.rds"))
          assert(st$sim_entries==3000L && st$sim_exits==3000L && st$forbidden==0L,
            "Pilot did not complete exactly 3000 guarded calls")
          assert(st$nr_entries==1L && st$postprocess_entries==1L,"Unexpected diagnostic path")
          assert(identical(as.numeric(result$theta),as.numeric(original_theta)) &&
            identical(original_theta,fit$theta),"Final coefficient vector changed")
          assert(identical(parameter_keys(result$requestedEffects),parameter_keys(fit$requestedEffects)) &&
            identical(as.logical(result$fixed),as.logical(fit$fixed)),"Final parameter flags/order changed")
          assert(result$n==3000L && result$Phase3nits==3000L && !isTRUE(result$Phase3Interrupt),"Wrong iteration count")
          full <- reconstruct_diagnostics(result$sf,result$fixed)
          first <- reconstruct_diagnostics(result$sf[1:1000,,drop=FALSE],result$fixed)
          assert(same_numbers(full$covariance,result$msf) && same_numbers(full$t_ratios,result$tconv) &&
            abs(full$overall-as.numeric(result$tconv.max))<1e-12,"Native diagnostic reconstruction mismatch")
          native <- fit_diagnostics(result,3000L)
          compact <- function(d,n) list(draws=n,maximum_absolute_t=d$maximum_absolute_t,
            overall=d$overall,individual_pass=d$maximum_absolute_t<0.1,overall_pass=d$overall<0.25)
          write.csv(result$sf,file.path(output,"moment-deviations.csv"),row.names=FALSE)
          write.csv(full$covariance,file.path(output,"moment-covariance.csv"),row.names=FALSE)
          map <- fit$requestedEffects[,identity_columns,drop=FALSE]
          map$theta<-original_theta;map$mean_deviation<-full$mean;map$t_ratio<-full$t_ratios
          write.csv(map,file.path(output,"parameter-diagnostics.csv"),row.names=FALSE,na="NA")
          flush_audit("completed")
          report<-list(status="completed",stage="3B",seed=2009301L,draws=3000L,replications=1L,
            training_years=1990:2008,actors=161L,parameters=58L,nsub=0L,simOnly=FALSE,
            coefficients_identical=TRUE,original_fixed_flags_preserved=TRUE,
            historical_attempt_accepted=FALSE,new_refits=0L,new_forecasts=0L,target_packets_read=0L,
            raw_archives_read=0L,step3c_started=FALSE,guard=audit("completed"),
            original_1000=list(maximum_absolute_t=old$maximum_absolute_t_ratio,overall=old$overall_maximum_convergence),
            fresh_first_1000=compact(first,1000L),fresh_full_3000=compact(full,3000L),
            native_diagnostics=native,source_function_verification=source_audit,self_tests=tests,
            interpretation="One fresh fixed-coefficient diagnostic, not a replication study or change to historical acceptance. First 1000 and full 3000 are nested, correlated subsets; seed and budget both differ from the historical diagnostic. No pure causal precision effect or search readiness is established.")
          write_json(report,file.path(output,"summary.json"),auto_unbox=TRUE,pretty=TRUE,digits=17,na="null")
          writeLines(capture.output(sessionInfo()),file.path(output,"session-info.txt"))
          report
        }

        if(sys.nframe()==0L) {
          args<-commandArgs(trailingOnly=TRUE)
          if(identical(args,"--self-test")) cat(toJSON(pilot_self_tests(),auto_unbox=TRUE),"\n")
          else {
            assert(length(args)==3L && args[1]=="--execute-one-pilot","Expected --execute-one-pilot ROOT OUTPUT")
            report<-run_pilot(normalizePath(args[2]),normalizePath(args[3]))
            cat(toJSON(report,auto_unbox=TRUE,pretty=TRUE,digits=17),"\n")
          }
        }
        STEP3B_FILE_0_END
        cat > scripts/convergence_pilot.py <<'STEP3B_FILE_1_END'
        #!/usr/bin/env python3
        """One authorized Step 3B diagnostic; no refits, forecasts or automatic retries."""
        from __future__ import annotations
        import argparse
        import datetime as dt
        import hashlib
        import json
        import math
        import os
        import signal
        from pathlib import Path
        import subprocess
        import sys

        ROOT = Path(__file__).resolve().parents[1]
        if str(ROOT) not in sys.path:
            sys.path.insert(0, str(ROOT))
        from scripts import convergence_preflight as pre

        OUTPUT = "results/diagnostics/convergence-pilot-v1"
        PLAN = {"stage": "3B", "version": "convergence-pilot-v1", "seed": 2009301,
                "n3": 3000, "nsub": 0, "simOnly": False, "replications": 1,
                "serial": True, "timeout_seconds": 3600, "training_years": list(range(1990, 2009)),
                "fit_path": pre.FIT, "fit_sha256": pre.FIT_SHA,
                "packet_member": pre.PACKET, "packet_sha256": pre.PACKET_SHA,
                "individual_threshold": 0.1, "overall_threshold": 0.25,
                "refits": 0, "forecasts": 0, "step3c": False}
        PREFLIGHT_HASHES = {
            "R/convergence_preflight.R": "b9deaf332852e108eaafe2123271303faf70f1638ea2198e6063929825a550e8",
            "scripts/convergence_preflight.py": "20da8e65111828766792024d4f82a21372e0ff58a2aea6ef8d379f7fc425cace",
            "configs/convergence-preflight-v1.json": "b84a567d4b2235af2ca180d49c1de7c7136f8b71b3238b81e0cbd56463a99483",
        }
        REQUIRED = {"request.json", "summary.json", "guard-audit.json", "raw-phase3.rds",
                    "diagnostic.rds", "moment-deviations.csv", "moment-covariance.csv",
                    "parameter-diagnostics.csv", "native.log", "resources.txt", "session-info.txt"}


        def inspect(root: Path = ROOT, native: bool = False) -> dict:
            for name, expected in PREFLIGHT_HASHES.items():
                if pre.sha(root / name) != expected:
                    raise ValueError(f"Step 3A source drift: {name}")
            pre.verify_artifacts(root / pre.DEFAULT_OUTPUT)
            return {"plan": PLAN, "preflight": pre.inspect(root, require_native=native),
                    "implementation": {p: pre.sha(root/p) for p in
                        ("R/convergence_pilot.R", "scripts/convergence_pilot.py")}}


        def validate_summary(s: dict) -> None:
            required = {"status":"completed", "stage":"3B", "seed":2009301,"draws":3000,
                        "replications":1,"nsub":0,"simOnly":False,"parameters":58,"actors":161,
                        "coefficients_identical":True,"original_fixed_flags_preserved":True,
                        "historical_attempt_accepted":False,"new_refits":0,"new_forecasts":0,
                        "target_packets_read":0,"raw_archives_read":0,"step3c_started":False,
                        "training_years":list(range(1990,2009))}
            for k,v in required.items():
                if s.get(k) != v or type(s.get(k)) is not type(v):
                    raise ValueError(f"Pilot scope or completion mismatch: {k}")
            guard = s["guard"]
            for k,v in {"status":"completed","phase3_entries":1,"simulator_entries":3000,
                        "simulator_exits":3000,"forbidden_entries":0,"potential_nr_calls":1,
                        "postprocessing_entries":1,"checked_every_simulator_call":True}.items():
                if guard.get(k) != v or type(guard.get(k)) is not type(v):
                    raise ValueError(f"Pilot guard mismatch: {k}")
            for k,n in (("fresh_first_1000",1000),("fresh_full_3000",3000)):
                d=s[k]
                if d.get("draws") != n:
                    raise ValueError("Wrong diagnostic sample size")
                for metric, threshold, flag in (("maximum_absolute_t",0.1,"individual_pass"),("overall",0.25,"overall_pass")):
                    x=d.get(metric)
                    if type(x) not in (int,float) or not math.isfinite(x) or x < 0 or d.get(flag) is not (x < threshold):
                        raise ValueError(f"Malformed diagnostic: {k}/{metric}")
            # A failed convergence criterion is a scientific result, NOT an execution error.
            d=s["native_diagnostics"]
            if type(d.get("valid")) is not bool:
                raise ValueError("Native diagnostic validity must be explicit")
            if d.get("phase3_iterations") != 3000 or d.get("phase3_complete") is not True:
                raise ValueError("Native phase 3 incomplete")
            for new,old in (("maximum_absolute_t_ratio","maximum_absolute_t"),("overall_maximum_convergence","overall")):
                if not math.isclose(d[new],s["fresh_full_3000"][old],rel_tol=0,abs_tol=1e-12):
                    raise ValueError("Saved native and reconstructed diagnostics differ")


        def verify_artifacts(output: Path) -> dict:
            commitment=pre.read(output/"commitment.json")
            if commitment.get("stage") != "3B" or not REQUIRED.issubset(commitment["artifacts"]):
                raise ValueError("Missing or wrong-stage evidence")
            for name,value in commitment["artifacts"].items():
                if Path(name).name != name or pre.sha(output/name) != value:
                    raise ValueError(f"Changed committed artifact: {name}")
            if pre.read(output/"request.json")["plan"] != PLAN:
                raise ValueError("Changed pilot plan")
            summary=pre.read(output/"summary.json");validate_summary(summary)
            return {"status":"verified", "draws":3000, "refits":0,
                    "diagnostic_pass":summary["native_diagnostics"]["valid"]}


        def native_process(command: list[str], *, cwd: Path, stdout, stderr, check: bool, timeout: int):
            """Terminate the whole process group on timeout, including R under /usr/bin/time."""
            proc = subprocess.Popen(command, cwd=cwd, stdout=stdout, stderr=stderr, start_new_session=True)
            try:
                code = proc.wait(timeout=timeout)
            except BaseException:
                if proc.poll() is None:
                    try:
                        os.killpg(proc.pid, signal.SIGTERM)
                    except ProcessLookupError:
                        pass
                    try:
                        proc.wait(timeout=30)
                    except subprocess.TimeoutExpired:
                        try:
                            os.killpg(proc.pid, signal.SIGKILL)
                        except ProcessLookupError:
                            pass
                        proc.wait()
                raise
            if check and code:
                raise subprocess.CalledProcessError(code, command)
            return subprocess.CompletedProcess(command, code)


        def run(output: Path, root: Path = ROOT, *, runner=native_process) -> dict:
            output=output.resolve()
            output.relative_to((root/"results/diagnostics").resolve())
            if output.exists():
                raise FileExistsError("Pilot directory exists. Inspect evidence; no automatic overwrite or retry.")
            inputs=inspect(root,native=True)
            output.mkdir(parents=True)
            request={**inputs,"created_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
            pre.write_new(output/"request.json",request)
            packet=output/"training-packet.rds"
            packet.write_bytes(pre.training_bytes(root/pre.BUNDLE))
            try:
                with (output/"native.log").open("x") as log:
                    runner(["/usr/bin/time","-v","-o",str(output/"resources.txt"),
                            str(root/"environment/run-r"),str(root/"R/convergence_pilot.R"),
                            "--execute-one-pilot",str(root),str(output)],cwd=root,
                           stdout=log,stderr=subprocess.STDOUT,check=True,timeout=PLAN["timeout_seconds"])
                if pre.sha(packet) != pre.PACKET_SHA or inspect(root,native=True) != inputs:
                    raise ValueError("Original scientific inputs changed during pilot")
                summary=pre.read(output/"summary.json");validate_summary(summary)
            except Exception as exc:
                pre.write_new(output/"failure.json",{"stage":"3B","status":"stopped",
                    "exception":type(exc).__name__,"message":str(exc),"automatically_retried":False,
                    "interpretation":"Not a fabricated convergence result. Inspect native log and partial evidence."})
                raise
            finally:
                packet.unlink(missing_ok=True)
            names={p.name:pre.sha(p) for p in sorted(output.iterdir()) if p.is_file()}
            if not REQUIRED.issubset(names):
                raise ValueError("Native evidence incomplete")
            pre.write_new(output/"commitment.json",{"stage":"3B","artifacts":names})
            verify_artifacts(output)
            return summary


        def main() -> int:
            p=argparse.ArgumentParser(description=__doc__)
            p.add_argument("action",choices=("check","run","verify-artifacts"))
            p.add_argument("--execute",action="store_true")
            p.add_argument("--output",type=Path,default=ROOT/OUTPUT)
            args=p.parse_args()
            if args.action=="run" and not args.execute:
                print("Dry request: one pilot requires --execute. No inputs read or simulations launched.")
                return 0
            try:
                result=(inspect() if args.action=="check" else run(args.output) if args.action=="run" else verify_artifacts(args.output))
            except (OSError,ValueError,KeyError,subprocess.SubprocessError) as exc:
                print(f"Step 3B stopped: {exc}",file=sys.stderr);return 1
            print(json.dumps(result,indent=2,allow_nan=False));return 0


        if __name__=="__main__":
            raise SystemExit(main())
        STEP3B_FILE_1_END
        cat > tests/test_convergence_pilot.py <<'STEP3B_FILE_2_END'
        """Synthetic/CLI contracts only. These tests do not execute R or network simulation."""
        import copy
        import hashlib
        import json
        from pathlib import Path
        import subprocess
        import sys
        import tempfile
        import unittest
        from unittest.mock import patch
        from scripts import convergence_pilot as p

        ROOT=Path(__file__).resolve().parents[1]

        def fixture(passes=True):
            overall=0.15 if passes else 0.3
            ratio=0.06 if passes else 0.12
            return {"status":"completed","stage":"3B","seed":2009301,"draws":3000,"replications":1,
              "nsub":0,"simOnly":False,"parameters":58,"actors":161,"coefficients_identical":True,
              "original_fixed_flags_preserved":True,"historical_attempt_accepted":False,"new_refits":0,
              "new_forecasts":0,"target_packets_read":0,"raw_archives_read":0,"step3c_started":False,
              "training_years":list(range(1990,2009)),
              "guard":{"status":"completed","phase3_entries":1,"simulator_entries":3000,"simulator_exits":3000,
                "forbidden_entries":0,"potential_nr_calls":1,"postprocessing_entries":1,"checked_every_simulator_call":True},
              "fresh_first_1000":{"draws":1000,"maximum_absolute_t":0.12,"overall":0.3,"individual_pass":False,"overall_pass":False},
              "fresh_full_3000":{"draws":3000,"maximum_absolute_t":ratio,"overall":overall,"individual_pass":passes,"overall_pass":passes},
              "native_diagnostics":{"valid":passes,"phase3_iterations":3000,"phase3_complete":True,
                "maximum_absolute_t_ratio":ratio,"overall_maximum_convergence":overall}}

        class PilotTests(unittest.TestCase):
            def test_declared_plan(self):
                self.assertEqual((p.PLAN['n3'],p.PLAN['seed'],p.PLAN['nsub']), (3000,2009301,0))
                self.assertFalse(p.PLAN['simOnly']);self.assertEqual(p.PLAN['replications'],1)
                self.assertEqual(p.PLAN['fit_sha256'],p.pre.FIT_SHA)

            def test_hash_bound_preflight_sources(self):
                for name,value in p.PREFLIGHT_HASHES.items():
                    self.assertEqual(hashlib.sha256((ROOT/name).read_bytes()).hexdigest(),value)

            def test_success_and_failed_convergence_both_valid_results(self):
                p.validate_summary(fixture(True));p.validate_summary(fixture(False))

            def test_scope_mutations_rejected(self):
                for key,value in {'seed':1,'draws':1000,'replications':5,'new_refits':1,'nsub':3,
                                  'simOnly':True,'historical_attempt_accepted':True,'step3c_started':True}.items():
                    with self.subTest(key=key),self.assertRaises(ValueError):
                        s=fixture();s[key]=value;p.validate_summary(s)

            def test_coefficient_mutation_rejected(self):
                s=fixture();s['coefficients_identical']=False
                with self.assertRaises(ValueError):p.validate_summary(s)

            def test_missed_guard_rejected(self):
                s=fixture();s['guard']['simulator_exits']=2999
                with self.assertRaises(ValueError):p.validate_summary(s)

            def test_nonfinite_metric_rejected(self):
                for value in (float('nan'),float('inf'),None,True):
                    with self.subTest(value=value),self.assertRaises(ValueError):
                        s=fixture();s['fresh_full_3000']['overall']=value;p.validate_summary(s)

            def test_false_pass_flag_rejected(self):
                s=fixture(False);s['fresh_full_3000']['overall_pass']=True
                with self.assertRaises(ValueError):p.validate_summary(s)

            def test_native_reconstruction_difference_rejected(self):
                s=fixture();s['native_diagnostics']['overall_maximum_convergence']=0.16
                with self.assertRaises(ValueError):p.validate_summary(s)

            def test_no_overwrite_or_automatic_retry(self):
                with tempfile.TemporaryDirectory() as t,patch.object(p,'inspect') as inspect:
                    root=Path(t);out=root/'results/diagnostics/existing';out.mkdir(parents=True)
                    with self.assertRaises(FileExistsError):p.run(out,root)
                    inspect.assert_not_called()

            def test_outside_diagnostic_output_refused(self):
                with tempfile.TemporaryDirectory() as t,patch.object(p,'inspect') as inspect:
                    with self.assertRaises(ValueError):p.run(Path(t)/'outside',Path(t))
                    inspect.assert_not_called()

            def test_dry_cli_and_help_need_no_real_data(self):
                for args in (['--help'],['run']):
                    r=subprocess.run([sys.executable,str(ROOT/'scripts/convergence_pilot.py'),*args],cwd='/tmp',capture_output=True,text=True)
                    self.assertEqual(r.returncode,0,r.stderr)

            def test_artifact_verification_and_tamper(self):
                with tempfile.TemporaryDirectory() as t:
                    out=Path(t)
                    for name in p.REQUIRED:(out/name).write_text('{}')
                    (out/'request.json').write_text(json.dumps({'plan':p.PLAN}))
                    (out/'summary.json').write_text(json.dumps(fixture(False)))
                    p.pre.write_new(out/'commitment.json',{'stage':'3B','artifacts':{n:p.pre.sha(out/n) for n in p.REQUIRED}})
                    self.assertFalse(p.verify_artifacts(out)['diagnostic_pass'])
                    (out/'raw-phase3.rds').write_text('changed')
                    with self.assertRaises(ValueError):p.verify_artifacts(out)

            def test_process_timeout_has_no_lingering_worker(self):
                with tempfile.TemporaryDirectory() as t:
                    root=Path(t);marker=root/'should-not-exist'
                    code='import time;from pathlib import Path;time.sleep(1);Path('+repr(str(marker))+').write_text("bad")'
                    with (root/'log').open('w') as log,self.assertRaises(subprocess.TimeoutExpired):
                        p.native_process([sys.executable,'-c',code],cwd=root,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=0.05)
                    self.assertFalse(marker.exists())

            def test_r_guards_and_original_sources_not_modified(self):
                code=(ROOT/'R/convergence_pilot.R').read_text()
                for token in ('check_simulation_state','check_phase3_state','MakeStep,FALSE','st$sim_entries<=3000L','prevAns=NULL'):
                    self.assertIn(token,code)
                self.assertNotIn('fit_model(',code)
                self.assertNotIn('R/forecast',code)
                self.assertNotIn('R/score',code)

        if __name__=='__main__':unittest.main()
