name: Step 4 - document launched comparison
on:
  push:
    branches: [repairs/step4-closure-comparison-20260921]
    paths: [.github/workflows/step4-publish-source.yml]
permissions:
  contents: write
jobs:
  document:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Update documentation only and preserve launch receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin repairs/step4-reserved-v1
          git checkout FETCH_HEAD -- results/step4-closure-comparison-v1/study-reservation.json
          python - <<'PY'
          from pathlib import Path
          import json
          launch=json.loads(Path('results/step4-closure-comparison-v1/study-reservation.json').read_text())
          assert launch['workflow_run']=='35626907047'
          readme=Path('README.md');s=readme.read_text()
          old='historical evaluators and results remain unchanged and Step 4 has not run.'
          assert s.count(old)==1
          s=s.replace(old,'historical evaluators and results remain unchanged. The separately declared Step 4 comparison below now explicitly consumes the new receipts.')
          heading='## 1. Research question'
          assert s.count(heading)==1
          section='''## Step 4: declared closure comparison launched

          The single **reference versus GWESP(69)** comparison is implemented and was
          launched in Actions run **35626907047**. This section records the launch,
          not a completed result. The running workers use their frozen source commit;
          documentation publication does not restart or modify their numerical work.

          Both specifications retain the original empirical controls and spending
          structure; only `transTriads(0)` is replaced by native `gwesp(69)` (alpha 0.69).
          The precision policy is applied consistently, including audited replay of
          the reference's 15 immutable optimization checkpoints, not historical
          acceptance labels. The new forecast consumer uses `authoritative_n3`.

          The finite plan is **eight model/year cells**, development years 2006–2009,
          and five 1,000-endpoint forecast batches per accepted cell. Primary annual
          points pool all 5,000 endpoints **before** scoring. Independent batch
          contrasts and an explicitly approximate five-block jackknife quantify
          conditional forecast Monte Carlo uncertainty, not fitting or historical
          generalization uncertainty. No decay search, Shinka run or 2010 scoring.

          Preflight passed **191 Python tests and 57 pinned-R checks**, including two
          actual receipt-aware forecast initializations stopped before simulation.
          See the [frozen design](docs/STEP4_COMPARISON.md) and
          [preflight evidence](results/diagnostics/step4-preflight-v1/execution.json).
          Each running model/year has a four-hour native-process budget; incomplete
          or failed cells are preserved, never replaced with another seed or a
          partial four-year score. Result branches are `repairs/step4-results/*`;
          the collector writes `repairs/step4-comparison-results-20260921` for review.
          Final results are not asserted here before that evidence is inspected.

          '''
          import textwrap
          s=s.replace(heading,textwrap.dedent(section)+heading)
          readme.write_text(s)
          guide=Path('docs/REPAIR_STEPS.md');s=guide.read_text()
          old='Step 4 has not started.'
          assert s.count(old)==1
          s=s.replace(old,'Step 4 is now implemented and launched as a single reference-versus-GWESP(69) comparison (Actions run 35626907047); it is not yet reported as complete. See [the frozen design](STEP4_COMPARISON.md).')
          old='| 4. A changed-specification comparison | Is an actual mechanism difference distinguishable from numerical variability? | Select and evaluate a motivated alternative under a declared bounded comparison. Do not infer search impossibility or publication readiness from one result. |'
          new='| **4. Changed-specification comparison: launched** | Is a single native closure substitution distinguishable from numerical variability? | Eight model/year cells; five forecast batches each; precision receipt consumer; 191 Python tests and 57 native preflight checks. No complete result until all required cells are verified. |'
          assert s.count(old)==1;s=s.replace(old,new);guide.write_text(s)
          PY
          python -m unittest discover -s tests -v > /tmp/step4-source-tests.log 2>&1
          tail -15 /tmp/step4-source-tests.log
          python scripts/update_readme_status.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/REPAIR_STEPS.md results/step4-closure-comparison-v1/study-reservation.json
          git diff --cached --check
          git commit -m 'Document validated Step 4 comparison and its active bounded execution; no numerical changes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
